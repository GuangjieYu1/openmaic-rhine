name: Build OpenMAIC image (linux/amd64)

# Why this exists: the deployment target is an Aliyun ECS with ~1.6 GB of RAM,
# which cannot build this image (a Next.js build needs ~2.4 GB and the box is
# already running other services). The Mac that holds the source is arm64, and
# the ECS is amd64, so a local build produces the wrong architecture. GitHub's
# runners are native amd64 with 16 GB, which is the only machine in this setup
# that can produce the right image.
#
# The output is a `docker save` tarball rather than a registry push: the ECS
# loads it with `docker load`.
#
# NEXT_PUBLIC_PERSISTENCE=1 is the one flag that decides WHERE a course lives.
# Unset, the browser keeps documents in IndexedDB and the /api/reinlab export
# surface — which reads the server database — cannot see anything generated by
# the guided flow. Set, documents go to /api/persistence and land in Postgres,
# so every course becomes visible to the native library and can be downloaded
# for offline use. NEXT_PUBLIC_PERSISTENCE_TOKEN is not a secret in the
# security sense (it is compiled into the public browser bundle and grants no
# confidentiality), but it is still read from a repository secret rather than
# committed, and the server-side PERSISTENCE_DEV_TOKEN must match it.

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: openmaic-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Required to publish the release the ECS pulls from. Everything else the job
  # does (checkout, build) only needs read.
  contents: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (linux/amd64)
        run: |
          set -euo pipefail
          TAG="openmaic-rhine:${GITHUB_SHA::12}"
          docker buildx build \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_PRO_WORKBENCH_ENABLED=true \
            --build-arg NEXT_PUBLIC_PERSISTENCE=1 \
            --build-arg NEXT_PUBLIC_PERSISTENCE_TOKEN="${{ secrets.NEXT_PUBLIC_PERSISTENCE_TOKEN }}" \
            --load \
            -t "$TAG" .
          docker images openmaic-rhine

      - name: Save the image
        run: |
          set -euo pipefail
          TAG="openmaic-rhine:${GITHUB_SHA::12}"
          docker save "$TAG" | gzip -9 > openmaic-rhine-image.tar.gz
          ls -lh openmaic-rhine-image.tar.gz
          echo "IMAGE_TAG=${GITHUB_SHA::12}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: openmaic-rhine-image
          path: openmaic-rhine-image.tar.gz
          retention-days: 3
          if-no-files-found: error

      # A release asset is what the ECS actually pulls. Actions artifacts need a
      # bearer token, and the deployment host must not hold one; a public release
      # asset needs nothing. It also removes this Mac from the path entirely —
      # its link to GitHub is fast outbound and slow inbound, so relaying a
      # 213 MB artifact through it took ~30 minutes against ~1 minute here.
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="image-${GITHUB_SHA::12}"
          gh release create "$TAG" \
            --title "OpenMAIC image $TAG" \
            --notes "linux/amd64 image, loadable with docker load. Built from $GITHUB_SHA." \
            openmaic-rhine-image.tar.gz
          echo "ASSET_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/openmaic-rhine-image.tar.gz" >> "$GITHUB_STEP_SUMMARY"
